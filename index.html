  <title>14-fourteen-</title>
  <style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  color: #171717;
  background: #f4f4f4;
  color-scheme: light;
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: #f4f4f4;
}

button,
input { font: inherit; }

button { touch-action: manipulation; }

.app-shell {
  width: min(100%, 760px);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}

.app-header { margin-bottom: 18px; }

h1,
h2 { margin: 0; }

h1 {
  font-size: clamp(1.75rem, 7vw, 2.5rem);
  line-height: 1.1;
}

.panel {
  padding: 18px;
  margin-bottom: 14px;
  background: #fff;
  border: 1px solid #dedede;
  border-radius: 16px;
}

.panel > h2 {
  margin-bottom: 14px;
  font-size: 1rem;
}

.track-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.track-button {
  min-height: 52px;
  padding: 10px 12px;
  border: 1px solid #bdbdbd;
  border-radius: 12px;
  background: #fff;
  color: #171717;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  cursor: pointer;
}

.track-button[data-track="piano"] { font-size: 0.9rem; }

.track-button-wide { grid-column: 1 / -1; }

.track-button.is-selected {
  border-color: #171717;
  background: #171717;
  color: #fff;
}

.track-button:focus-visible,
.primary-button:focus-visible,
#seek:focus-visible,
#volume:focus-visible {
  outline: 3px solid #555;
  outline-offset: 3px;
}

.player-panel { padding-bottom: 20px; }

.player-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.current-track {
  font-size: clamp(1.4rem, 6vw, 2rem);
}

.play-state {
  flex: 0 0 auto;
  min-width: 4.5em;
  padding: 6px 9px;
  border-radius: 999px;
  background: #efefef;
  font-size: 0.85rem;
  font-weight: 700;
  text-align: center;
}

.timeline { margin-top: 28px; }

.timeline label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 0.9rem;
  font-weight: 700;
}

#seek {
  width: 100%;
  min-height: 32px;
  margin: 0;
  accent-color: #171717;
  cursor: pointer;
}

.time-row {
  display: flex;
  justify-content: space-between;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  color: #555;
}

.time-row span {
  width: 5ch;
  white-space: nowrap;
}

.time-row span:last-child { text-align: right; }

.volume-control { margin-top: 22px; }

.volume-control label {
  display: block;
  margin-bottom: 8px;
  font-size: 0.9rem;
  font-weight: 700;
}

#volume {
  width: 100%;
  min-height: 32px;
  margin: 0;
  accent-color: #171717;
  cursor: pointer;
}

.primary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 58px;
  margin-top: 22px;
  border: 0;
  border-radius: 14px;
  background: #171717;
  color: #fff;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
}

.repeat-button {
  width: 100%;
  min-height: 48px;
  margin-top: 10px;
  border: 1px solid #bdbdbd;
  border-radius: 12px;
  background: #fff;
  color: #171717;
  font-weight: 700;
  cursor: pointer;
}

.repeat-button[aria-pressed="true"] {
  border-color: #171717;
  background: #171717;
  color: #fff;
}

.repeat-button:focus-visible {
  outline: 3px solid #555;
  outline-offset: 3px;
}

.primary-button:disabled,
.track-button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.status {
  min-height: 1.4em;
  margin: 4px 4px 0;
  color: #8a1f11;
  font-size: 0.9rem;
}

.install-area {
  margin-top: 14px;
}

.install-button {
  width: 100%;
  min-height: 48px;
  border: 1px solid #bdbdbd;
  border-radius: 12px;
  background: #fff;
  color: #171717;
  font-weight: 700;
  cursor: pointer;
}

.install-help {
  margin: 10px 2px 0;
  color: #555;
  font-size: 0.88rem;
  line-height: 1.55;
}

.install-button:focus-visible {
  outline: 3px solid #555;
  outline-offset: 3px;
}

@media (min-width: 600px) {
  .app-shell { padding-top: 36px; }

  .track-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }

  .track-button-wide { grid-column: auto; }

  .panel { padding: 22px; }
}

</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <header class="app-header">
      <h1 id="app-title">14-fourteen-</h1>
    </header>

    <section class="panel">
      <div class="track-grid" id="track-grid" role="group" aria-label="再生する音源">
        <button class="track-button is-selected" type="button" data-track="chorus" aria-pressed="true">合唱</button>
        <button class="track-button" type="button" data-track="soprano" aria-pressed="false">ソプラノ</button>
        <button class="track-button" type="button" data-track="alto" aria-pressed="false">アルト</button>
        <button class="track-button" type="button" data-track="tenor" aria-pressed="false">テノール</button>
        <button class="track-button track-button-wide" type="button" data-track="piano" aria-pressed="false">カラピアノ</button>
      </div>
    </section>

    <section class="panel player-panel" aria-labelledby="player-heading">
      <div class="player-title-row">
        <div>
          <h2 id="player-heading" class="current-track">合唱</h2>
        </div>
        <output id="play-state" class="play-state" aria-live="polite">停止中</output>
      </div>

      <audio id="audio" preload="metadata" src="chorus.mp3"></audio>

      <div class="timeline">
        <label for="seek">再生位置</label>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置">
        <div class="time-row" aria-label="再生時間">
          <span id="current-time">0:00</span>
          <span id="duration">--:--</span>
        </div>
      </div>

      <div class="volume-control">
        <label for="volume">音量</label>
        <input id="volume" type="range" min="0" max="100" value="50" step="1" aria-label="音量">
      </div>

      <button id="play-pause" class="primary-button" type="button" aria-label="再生">
        <span id="play-icon" aria-hidden="true">▶</span>
        <span id="play-label">再生</span>
      </button>

      <button id="repeat-toggle" class="repeat-button" type="button" aria-pressed="false">
        リピート OFF
      </button>
    </section>

    <div id="install-area" class="install-area" hidden>
      <button id="install-app" class="install-button" type="button">ホーム画面に追加</button>
      <p id="install-help" class="install-help" hidden></p>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script>
"use strict";

const CHORUS_VOLUME_FACTOR = 0.586;

const TRACKS = Object.freeze({
  chorus: { label: "合唱", src: "chorus.mp3" },
  soprano: { label: "ソプラノ", src: "soprano.mp3" },
  alto: { label: "アルト", src: "alto.mp3" },
  tenor: { label: "テノール", src: "tenor.mp3" },
  piano: { label: "カラピアノ", src: "piano.mp3" }
});

const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const currentTimeEl = document.getElementById("current-time");
const volume = document.getElementById("volume");
const durationEl = document.getElementById("duration");
const playPauseButton = document.getElementById("play-pause");
const playIcon = document.getElementById("play-icon");
const playLabel = document.getElementById("play-label");
const playState = document.getElementById("play-state");
const repeatToggle = document.getElementById("repeat-toggle");
const currentTrack = document.querySelector(".current-track");
const status = document.getElementById("status");
const installArea = document.getElementById("install-area");
const installButton = document.getElementById("install-app");
const installHelp = document.getElementById("install-help");
const trackButtons = Array.from(document.querySelectorAll(".track-button"));

let selectedTrackKey = "chorus";
let isSeeking = false;
let deferredInstallPrompt = null;

function formatTime(value) {
  if (!Number.isFinite(value) || value < 0) return "--:--";
  const totalSeconds = Math.floor(value);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}:${String(seconds).padStart(2, "0")}`;
}

function updatePlayUi() {
  const isPlaying = !audio.paused && !audio.ended;
  playIcon.textContent = isPlaying ? "Ⅱ" : "▶";
  playLabel.textContent = isPlaying ? "一時停止" : "再生";
  playPauseButton.setAttribute("aria-label", isPlaying ? "一時停止" : "再生");
  playState.textContent = isPlaying ? "再生中" : "停止中";
}

function updateTimeline() {
  const duration = audio.duration;
  const current = audio.currentTime;

  currentTimeEl.textContent = formatTime(current);
  durationEl.textContent = formatTime(duration);

  if (!isSeeking && Number.isFinite(duration) && duration > 0) {
    seek.value = String(Math.round((current / duration) * 1000));
  }
}

function updateVolume() {
  const userVolume = Number(volume.value) / 100;
  const trackFactor = selectedTrackKey === "chorus" ? CHORUS_VOLUME_FACTOR : 1;
  audio.volume = userVolume * trackFactor;
}

function updateRepeatUi() {
  repeatToggle.setAttribute("aria-pressed", String(audio.loop));
  repeatToggle.textContent = audio.loop ? "リピート ON" : "リピート OFF";
}

function toggleRepeat() {
  audio.loop = !audio.loop;
  updateRepeatUi();
}

function clearStatus() {
  status.textContent = "";
}

function setStatus(message) {
  status.textContent = message;
}

async function togglePlayback() {
  clearStatus();

  if (!audio.paused && !audio.ended) {
    audio.pause();
    return;
  }

  try {
    await audio.play();
  } catch (error) {
    setStatus("再生を開始できませんでした。もう一度再生ボタンを押してください。");
    updatePlayUi();
  }
}

function selectTrack(trackKey) {
  if (!(trackKey in TRACKS) || trackKey === selectedTrackKey) return;

  const track = TRACKS[trackKey];
  selectedTrackKey = trackKey;

  audio.pause();
  audio.src = track.src;
  audio.load();
  updateVolume();

  currentTrack.textContent = track.label;
  seek.value = "0";
  currentTimeEl.textContent = "0:00";
  durationEl.textContent = "--:--";
  clearStatus();
  updatePlayUi();

  trackButtons.forEach((button) => {
    const selected = button.dataset.track === trackKey;
    button.classList.toggle("is-selected", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
}

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function isIos() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

function showIosInstallHelp() {
  installArea.hidden = false;
  installHelp.hidden = true;
}

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if (!isStandalone()) installArea.hidden = false;
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  installArea.hidden = true;
  installHelp.hidden = true;
});

installButton.addEventListener("click", async () => {
  installHelp.hidden = true;

  if (deferredInstallPrompt) {
    await deferredInstallPrompt.prompt();
    deferredInstallPrompt = null;
    installArea.hidden = true;
    return;
  }

  if (isIos()) {
    installHelp.textContent = "Safariの共有ボタンを開き、「ホーム画面に追加」→「追加」を選んでください。";
    installHelp.hidden = false;
  }
});

if (!isStandalone() && isIos()) showIosInstallHelp();

trackButtons.forEach((button) => {
  button.addEventListener("click", () => selectTrack(button.dataset.track));
});

playPauseButton.addEventListener("click", togglePlayback);
repeatToggle.addEventListener("click", toggleRepeat);
volume.addEventListener("input", updateVolume);

seek.addEventListener("pointerdown", () => {
  isSeeking = true;
});

seek.addEventListener("input", () => {
  const duration = audio.duration;
  if (!Number.isFinite(duration) || duration <= 0) return;
  const previewTime = (Number(seek.value) / 1000) * duration;
  currentTimeEl.textContent = formatTime(previewTime);
});

seek.addEventListener("change", () => {
  const duration = audio.duration;
  if (Number.isFinite(duration) && duration > 0) {
    audio.currentTime = (Number(seek.value) / 1000) * duration;
  }
  isSeeking = false;
  updateTimeline();
});

seek.addEventListener("pointerup", () => {
  isSeeking = false;
});

seek.addEventListener("pointercancel", () => {
  isSeeking = false;
});

audio.addEventListener("loadedmetadata", updateTimeline);
audio.addEventListener("durationchange", updateTimeline);
audio.addEventListener("timeupdate", updateTimeline);
audio.addEventListener("play", updatePlayUi);
audio.addEventListener("pause", updatePlayUi);
audio.addEventListener("ended", () => {
  updatePlayUi();
  updateTimeline();
});
audio.addEventListener("error", () => {
  setStatus("音源を読み込めませんでした。");
  updatePlayUi();
});

updateVolume();
updatePlayUi();
updateRepeatUi();
updateTimeline();

  </script>
</body>
</html>
